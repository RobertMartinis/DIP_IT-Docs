    <line x1="585" y1="330" x2="675" y2="292"/>
    <line x1="330" y1="325" x2="500" y2="310"/>
    <line x1="405" y1="345" x2="585" y2="330"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
