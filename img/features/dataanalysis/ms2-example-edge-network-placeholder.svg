<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Edge interval network placeholder</title>
  <desc id="desc">Placeholder image for the fragment network that collects ions at the edge of the stepped isolation interval.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <rect x="24" y="24" width="852" height="472" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
