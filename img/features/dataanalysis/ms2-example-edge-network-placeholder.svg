    <circle cx="330" cy="325" r="26" fill="#fbbf24"/>
    <text x="330" y="331" fill="#451a03">342.5</text>
    <circle cx="405" cy="345" r="26" fill="#fbbf24"/>
    <text x="405" y="351" fill="#451a03">342.6</text>
    <circle cx="500" cy="310" r="26" fill="#fbbf24"/>
    <text x="500" y="316" fill="#451a03">343.7</text>
    <circle cx="585" cy="330" r="26" fill="#fbbf24"/>
    <text x="585" y="336" fill="#451a03">343.8</text>
    <circle cx="675" cy="292" r="26" fill="#fbbf24"/>
